# Checks this repository declares for itself, on top of amont's built-ins.
# Committed on purpose: a check nobody else installs is a check nobody else runs.
# Each clone accepts it once with `amont trust` — `amont list` shows what runs.
#
# typecheck is declared HERE, at commit time, rather than left to the push gate:
# a type error is cheapest to hear about at the commit that caused it. amont
# then drops it from pre-push-run-tests-js rather than running it twice, so the
# push is left running the storybook suite alone.
#
# stage       name       scope       severity  command
pre-commit    typecheck  *.ts,*.tsx  block     pnpm run typecheck
pre-commit    lint       *.ts,*.tsx  block     pnpm run lint
# Registry/docs freshness at push time (not per-commit — ts-morph costs ~5s).
pre-push      registry   *.ts,*.tsx,*.md  block  node packages/cli/scripts/build-registry.mjs --check --check-docs

# Architecture decisions must still resolve. `aval check` rebuilds the decision
# graph and fails on a duplicate id, a supersession edge pointing at nothing,
# competing heads for one key, a key decided outside the scopes it declares, a
# stale HEADS.md, or a citation that no longer resolves.
#
# Scope is `*`, not `*.md`: links-resolve reads the whole tree, so renaming a
# cited file must run the gate, and a markdown-only trigger would miss exactly
# the change that breaks a citation. The `+.adr.yaml` half keeps it inert in any
# repository without a registry.
#
# A missing binary is reported as a gap and does NOT block — install it with
# install/install.sh from github.com/fredericrous/aval.
pre-commit  adr  *+.adr.yaml  block  aval check

# The `areas:` in .adr.yaml are a reviewed declaration of which parts of this
# repository are a command line or a UI, and they decide which fleet rules the
# session hook shows. This blocks when a package stops matching them (exit 1)
# or cannot be inspected (exit 3). Detection is advisory: a false positive
# belongs under `disclaims:` in .adr.yaml, with the reason beside it.
pre-commit  traits  *+.adr.yaml  block  aval traits --check
