name: Release

on:
  push:
    tags:
      - 'v*'
  # Resume a publish that failed part-way: `gh workflow run release.yaml -f
  # tag=v7.0.0`. The publish step skips each name@version that `npm view`
  # already finds, so the run publishes only what is missing; its log shows
  # the skips as `already on npm, skipped:` lines.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish again, for example v7.0.0'
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # A tag push and a resume of the same tag never publish at once.
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    # `id-token: write` is the whole credential: npm's trusted publishing
    # trades this workflow's OIDC token for a short-lived publish token, and
    # `--provenance` signs with the same grant. There is no NPM_TOKEN. Each
    # @greenharness/greenrack-* package names greenharness/greenrack's
    # `release.yaml` (no environment) as its trusted publisher on npmjs.com;
    # a package that does not is refused with a 404. A new name is created
    # once by hand (a 0.0.0-reserved placeholder) before its first release.
    permissions:
      contents: read
      id-token: write
    env:
      # One tag for every step. On a dispatch, github.ref_name is the branch,
      # so the input wins. Passed through env, never written into a script.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The full ref: a branch named like the tag must never be checked out.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No `registry-url`: it writes an .npmrc that sends NODE_AUTH_TOKEN, a
      # stray credential that npm used instead of the OIDC one (v7.0.0's first
      # three runs, 404 on PUT). npm's default registry is registry.npmjs.org.
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2 && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Set version from git tag
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "Publishing version $VERSION"
          pnpm -r exec npm pkg set "version=$VERSION"
          sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" packages/cli/greenharness.toml
          grep -qx "version = \"$VERSION\"" packages/cli/greenharness.toml
      - name: CLI floors match the release's major
        run: node packages/cli/scripts/check-pin-major.mjs "${TAG#v}"
      - run: pnpm build
      - run: pnpm check:types-packed
      # pnpm packs (it rewrites `workspace:` ranges); npm publishes. `pnpm -r
      # publish` hands npm a tarball, and npm then never tried the OIDC
      # exchange (ENEEDAUTH, v7.0.0's fourth run). npm publishing a directory
      # is greengate's path, which trusted publishing serves.
      - name: Publish (trusted publishing)
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out"
          # Workspace packages in dependency order, one path per line.
          pnpm -r --workspace-concurrency=1 exec pwd > "$out/order"
          while IFS= read -r dir; do
            name=$(jq -r .name "$dir/package.json")
            if [ "$(jq -r '.private // false' "$dir/package.json")" = true ]; then
              echo "private, skipped: $name"
              continue
            fi
            # A missing version prints nothing and still exits 0.
            if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "already on npm, skipped: $name@$VERSION"
              continue
            fi
            work="$out/$(basename "$dir")"
            mkdir -p "$work"
            (cd "$dir" && pnpm pack --pack-destination "$work" >/dev/null)
            tar -xzf "$work"/*.tgz -C "$work"
            npm publish "$work/package" --provenance --access public --ignore-scripts
            echo "published: $name@$VERSION"
          done < "$out/order"
