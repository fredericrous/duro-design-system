name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer run for the same ref cancels the older one, so a stalled job never
# lingers on (and hogs) the self-hosted runner once it's been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: duro-design-system
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --check packages/

  lint:
    name: Lint
    runs-on: duro-design-system
    needs: format
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds @duro-app/eslint-plugin, then lints this repo with it — the
      # plugin's own rules are exercised against real story/recipe source.
      - name: Lint
        run: pnpm lint
      # The CLI's bin end-to-end tests exec dist/bin.js, so build it first
      # (its prebuild doubles as a registry freshness check).
      - name: Build CLI
        run: pnpm --filter @duro-app/cli run build
      # Node-only unit suites (lint rules + CLI/registry); runs here rather
      # than behind the 30-minute Playwright job so failures land in a minute.
      - name: Unit tests
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: pnpm test:unit -- --run
      # The committed registry and CLAUDE.md generated regions are pure
      # functions of the source tree — regenerating must be a no-op.
      - name: Registry & docs freshness
        run: node packages/cli/scripts/build-registry.mjs --check --check-docs

  validate:
    name: Validate
    runs-on: duro-design-system
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: pnpm typecheck
      - name: Build libraries
        run: pnpm build
      - name: Build Storybook
        run: pnpm build-storybook

  test:
    name: Storybook Tests
    runs-on: duro-design-system
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # apt-deps for Chromium — this part has always succeeded; keep it separate
      # from the browser download so the two failure modes don't entangle.
      - name: Install Playwright system deps
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium

      # Cache the browser binaries so they're downloaded rarely (not every run).
      # restore-keys lets a near-match (same Playwright version) restore even
      # when the lockfile hash changes.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Node's Playwright downloader stalls at 0% pulling chrome-headless-shell
      # from storage.googleapis.com on this self-hosted runner — over BOTH IPv4
      # and IPv6, even though `curl` downloads the very same file fine in the
      # same pod (verified by exec). So fetch the binaries with curl and drop
      # them into Playwright's cache; the install step below then finds them and
      # is a no-op. `chromium-headless-shell` pulls ffmpeg too, hence the loop
      # over every (Install location, Download url) pair from --dry-run. Linux
      # zips contain a top-level dir matching Playwright's expected layout.
      - name: Prefetch Playwright browsers via curl
        timeout-minutes: 6
        run: |
          set -euo pipefail
          info="$(pnpm exec playwright install --dry-run chromium-headless-shell 2>/dev/null)"
          printf '%s\n' "$info"
          paste -d'\t' \
            <(printf '%s\n' "$info" | sed -nE 's/^[[:space:]]*Install location:[[:space:]]*//p') \
            <(printf '%s\n' "$info" | sed -nE 's/^[[:space:]]*Download url:[[:space:]]*//p') \
          | while IFS="$(printf '\t')" read -r dir url; do
              [ -z "$dir" ] && continue
              if [ -f "$dir/INSTALLATION_COMPLETE" ]; then echo "cached: $dir"; continue; fi
              echo "curl -> $dir"
              mkdir -p "$dir"
              curl -4 -fSL --retry 5 --retry-all-errors --connect-timeout 20 -o /tmp/pw.zip "$url"
              unzip -qo /tmp/pw.zip -d "$dir"
              touch "$dir/INSTALLATION_COMPLETE" "$dir/DEPENDENCIES_VALIDATED"
            done

      - name: Install Playwright browser (verify; no-op after prefetch)
        timeout-minutes: 5
        run: pnpm exec playwright install chromium-headless-shell

      - name: Run visual & a11y tests
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        timeout-minutes: 15
        run: pnpm test -- --run
