name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer run for the same ref cancels the older one, so a stalled job never
# lingers on (and hogs) the self-hosted runner once it's been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --check packages/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: format
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds @duro-app/eslint-plugin, then lints this repo with it — the
      # plugin's own rules are exercised against real story/recipe source.
      - name: Lint
        run: pnpm lint
      # The CLI's bin end-to-end tests exec dist/bin.js, so build it first
      # (its prebuild doubles as a registry freshness check).
      - name: Build CLI
        run: pnpm --filter @duro-app/cli run build
      # Node-only unit suites (lint rules + CLI/registry); runs here rather
      # than behind the 30-minute Playwright job so failures land in a minute.
      - name: Unit tests
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: pnpm test:unit -- --run
      # The committed registry and CLAUDE.md generated regions are pure
      # functions of the source tree — regenerating must be a no-op.
      - name: Registry & docs freshness
        run: node packages/cli/scripts/build-registry.mjs --check --check-docs

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ui reads every tokens entry from source (customConditions: source), so it
      # typechecks with no tokens build. `prepare` built tokens at install, so the
      # check deletes that output first, or it could not fail.
      - name: Typecheck ui without a tokens build
        run: rm -rf packages/tokens/dist && pnpm --filter @duro-app/ui run typecheck
      # Build first: @duro-app/tokens/theme resolves its types from dist/ for cli.
      - name: Build libraries
        run: pnpm build
      - name: Packed types (attw)
        run: pnpm check:types-packed
      - name: Typecheck
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: pnpm typecheck
      - name: Build Storybook
        run: pnpm build-storybook

  test:
    name: Storybook Tests
    # Pinned: Playwright does not support chromium-headless-shell on the Ubuntu 26.04
    # that ubuntu-latest now resolves to. Move to ubuntu-latest once it does.
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # apt-deps for Chromium — this part has always succeeded; keep it separate
      # from the browser download so the two failure modes don't entangle.
      - name: Install Playwright system deps
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium

      # Cache the browser binaries so they're downloaded rarely (not every run).
      # restore-keys lets a near-match (same Playwright version) restore even
      # when the lockfile hash changes.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        timeout-minutes: 5
        run: pnpm exec playwright install chromium-headless-shell

      - name: Run visual & a11y tests
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        timeout-minutes: 15
        run: pnpm test -- --run

  # React Native: the native barrel typechecks against RN's types and
  # examples/native (a standalone Expo app with its own lockfile) bundles it
  # for iOS and Android. Build-as-check, so never attested away (ADR-0024).
  native:
    name: Native bundle
    runs-on: ubuntu-latest
    needs: validate
    # holds-until: the cold-cache time is measured on this runner; then twice it.
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Content-based skip: run only when a file that can change the native
      # graph changed. Fails open — any error computing the diff runs the job —
      # and a skipped job is green.
      - name: Native-relevant changes
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! changed="$(git diff --name-only "$base" HEAD 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(packages/ui/src/|packages/tokens/src/|examples/native/|packages/ui/package\.json$|packages/ui/tsconfig[^/]*\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|scripts/check-native-(graph|bundle)\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No native-relevant change; skipping."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the workspace
        if: steps.filter.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install examples/native
        if: steps.filter.outputs.run == 'true'
        run: pnpm native:install
      - name: Build tokens
        if: steps.filter.outputs.run == 'true'
        run: pnpm --filter @duro-app/tokens run build
      - name: Native typecheck
        if: steps.filter.outputs.run == 'true'
        run: pnpm typecheck:native
      # Also checks that the bundles hold one copy of each shared runtime.
      - name: Export iOS and Android bundles
        if: steps.filter.outputs.run == 'true'
        run: pnpm native:export
